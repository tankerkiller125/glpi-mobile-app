name: glpi_mobile
description: "Offline-first mobile client for GLPI 11 — helpdesk, assets and planning for technicians in the field."
homepage: https://github.com/tankerkiller125/glpi-mobile
repository: https://github.com/tankerkiller125/glpi-mobile
issue_tracker: https://github.com/tankerkiller125/glpi-mobile/issues
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  clock: ^1.1.2
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: ^2.34.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^18.0.1
  go_router: ^17.4.0
  intl: any # resolved by flutter_localizations
  json_annotation: ^4.12.0
  mobile_scanner: ^7.1.2
  image_picker: ^1.1.2
  unifiedpush: ^6.2.0
  oauth2: ^2.0.5
  path_provider: ^2.1.6
  path: ^1.9.0
  riverpod_annotation: ^4.0.3
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  flutter_html: ^3.0.0
  flutter_quill: ^11.5.1
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  flutter_html_table: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
