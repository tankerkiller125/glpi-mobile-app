name: Release

# Tags are cut by hand: `git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0`.
# The tag must match `version:` in pubspec.yaml (the +build suffix is ignored) —
# the verify job fails the run otherwise, before anything is published.
#
# workflow_dispatch runs the same builds against any ref and uploads the
# artifacts to the run, but never creates a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          full=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          version="${full%%+*}"
          echo "pubspec version: $full (name: $version)"
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${version}. Fix pubspec.yaml or retag."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A hyphen in the version marks a pre-release (v1.0.0-rc.1).
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                             *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Live tests (-t live) need a real GLPI server and stay skipped here.
      - name: Test
        run: flutter test

  android:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Read at job level so later steps can branch on it in an `if:`.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install Android SDK 37
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      # Optional signing. Without these secrets the build falls back to the
      # debug key (see android/app/build.gradle.kts) — fine for testing, but a
      # debug-signed APK cannot be upgraded in place from a properly signed one.
      #   ANDROID_KEYSTORE_BASE64   base64 of your .jks
      #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
      - name: Configure signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${RUNNER_TEMP}/upload.jks
          EOF

      - name: Warn when unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "### ⚠️ Android artifacts are debug-signed" >> "$GITHUB_STEP_SUMMARY"
          echo "No ANDROID_KEYSTORE_BASE64 secret is set, so this build used the debug key and no App Bundle was produced. Users cannot upgrade in place from a release-signed build." >> "$GITHUB_STEP_SUMMARY"

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect per-ABI APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" .apk); abi="${abi#app-}"; abi="${abi%-release}"
            cp "$f" "dist/glpi-mobile-${VERSION}-${abi}.apk"
          done

      - name: Build universal APK
        run: flutter build apk --release

      - name: Collect universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "dist/glpi-mobile-${VERSION}-universal.apk"

      # An App Bundle is only useful signed with the Play upload key, so it is
      # built only when a keystore is configured.
      - name: Build App Bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab "dist/glpi-mobile-${VERSION}.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: Build iOS
    needs: verify
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Full signing needs all four; any missing one falls back to an unsigned
      # IPA so a release still ships something for iOS.
      #   APPLE_CERTIFICATE_BASE64      base64 of a distribution .p12
      #   APPLE_CERTIFICATE_PASSWORD    its export password
      #   APPLE_PROVISIONING_PROFILE_BASE64  base64 .mobileprovision for tech.norsewave.glpi
      #   APPLE_TEAM_ID                 10-character team id
      # Optional repository variables: APPLE_EXPORT_METHOD (default ad-hoc,
      # which Xcode 16+ also spells "release-testing"; an app-store IPA cannot
      # be installed directly) and APPLE_CODE_SIGN_IDENTITY.
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_EXPORT_METHOD: ${{ vars.APPLE_EXPORT_METHOD || 'ad-hoc' }}
      APPLE_CODE_SIGN_IDENTITY: ${{ vars.APPLE_CODE_SIGN_IDENTITY || 'Apple Distribution' }}
      BUNDLE_ID: tech.norsewave.glpi
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decide signing mode
        id: mode
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ iOS artifact is unsigned" >> "$GITHUB_STEP_SUMMARY"
            echo "Apple signing secrets are not configured, so the release carries an unsigned IPA. It cannot be installed on a stock iPhone; re-sign it yourself, or set APPLE_CERTIFICATE_BASE64 / APPLE_CERTIFICATE_PASSWORD / APPLE_PROVISIONING_PROFILE_BASE64 / APPLE_TEAM_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- Signed path -----------------------------------------------------
      - name: Import certificate and provisioning profile
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/build.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          rm -f "${RUNNER_TEMP}/cert.p12"

          profiles="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > "${RUNNER_TEMP}/profile.mobileprovision"
          security cms -D -i "${RUNNER_TEMP}/profile.mobileprovision" > "${RUNNER_TEMP}/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${RUNNER_TEMP}/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "${RUNNER_TEMP}/profile.plist")
          cp "${RUNNER_TEMP}/profile.mobileprovision" "${profiles}/${uuid}.mobileprovision"
          echo "PROFILE_NAME=${name}" >> "$GITHUB_ENV"

      - name: Configure Xcode signing
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          # The Runner target leaves signing to the xcconfig, so appending here
          # switches the archive to manual signing without touching the pbxproj.
          cat >> ios/Flutter/Release.xcconfig <<EOF

          // Injected by CI — see .github/workflows/release.yml
          DEVELOPMENT_TEAM=${APPLE_TEAM_ID}
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=${APPLE_CODE_SIGN_IDENTITY}
          PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}
          EOF

          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${APPLE_EXPORT_METHOD}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          flutter build ipa --release --export-options-plist="${RUNNER_TEMP}/ExportOptions.plist"
          mkdir -p dist
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          cp "$ipa" "dist/glpi-mobile-${VERSION}.ipa"

      # --- Unsigned fallback ------------------------------------------------
      - name: Build unsigned IPA
        if: steps.mode.outputs.signed != 'true'
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          mkdir -p dist build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          (cd build/ios/unsigned && zip -qry "${GITHUB_WORKSPACE}/dist/glpi-mobile-${VERSION}-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify, android, ios]
    # A broken iOS build should not withhold the Android release: publish what
    # built, and say plainly in the run summary that iOS is missing.
    if: |
      always() && github.ref_type == 'tag'
      && needs.verify.result == 'success'
      && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Note a missing iOS build
        if: needs.ios.result != 'success'
        run: |
          echo "### ⚠️ Released without an iOS artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "The iOS job did not succeed (${{ needs.ios.result }}); the release carries Android artifacts only." >> "$GITHUB_STEP_SUMMARY"

      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          (cd dist && sha256sum ./* | sed 's| \./| |' > SHA256SUMS.txt)
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          body: |
            ## Install

            **Android** — grab `glpi-mobile-${{ needs.verify.outputs.version }}-arm64-v8a.apk`
            for any phone made in the last decade, or the `universal` APK if you
            are unsure. `SHA256SUMS.txt` covers every file below.

            **iOS** — if an IPA is attached, note that an `-unsigned` one is not
            installable on a stock iPhone; it is there for anyone re-signing
            with their own Apple developer account.

            The matching GLPI plugin release is at
            https://github.com/tankerkiller125/glpi-mobile-plugin/releases

            ---
